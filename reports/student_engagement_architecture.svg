<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title description">
  <title id="title">Student engagement synthetic-data pipeline</title>
  <desc id="description">Canvas activity data is cleaned and split; training-only preprocessing feeds synthetic data generators, whose output is evaluated for fidelity and used to train XGBoost classifiers evaluated against a held-out real test set. Saved outputs support an offline Streamlit dashboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 18px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 13px; fill: #334155; }
      .note { font-size: 13px; font-style: italic; fill: #475569; }
      .box { stroke-width: 2; rx: 12; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#ffffff"/>
  <text x="700" y="46" text-anchor="middle" class="title">Student Engagement Synthetic-Data Pipeline</text>
  <text x="700" y="74" text-anchor="middle" class="subtitle">Offline research workflow: generator comparison, predictive utility, and exploratory dashboard</text>

  <rect x="45" y="112" width="1310" height="160" fill="#f8fafc" stroke="#cbd5e1" class="box"/>
  <text x="68" y="143" class="section">1. Data preparation</text>

  <rect x="75" y="165" width="235" height="76" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="192" y="192" text-anchor="middle" class="box-title">Canvas Person-Course data</text>
  <text x="192" y="216" text-anchor="middle" class="body">Learning activity + completion</text>

  <rect x="390" y="165" width="265" height="76" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="522" y="192" text-anchor="middle" class="box-title">Clean, label, select</text>
  <text x="522" y="214" text-anchor="middle" class="body">Keep known completion; label at 0.5</text>
  <text x="522" y="232" text-anchor="middle" class="small">4 activity features; exclude IDs / target leakage</text>

  <rect x="735" y="165" width="245" height="76" fill="#dbeafe" stroke="#3b82f6" class="box"/>
  <text x="857" y="192" text-anchor="middle" class="box-title">Stratified 80 / 20 split</text>
  <text x="857" y="216" text-anchor="middle" class="body">Seed 42; split before fitting preprocessing</text>

  <rect x="1070" y="158" width="245" height="55" fill="#dcfce7" stroke="#22a05a" class="box"/>
  <text x="1192" y="181" text-anchor="middle" class="box-title">Real training data</text>
  <text x="1192" y="201" text-anchor="middle" class="small">21,328 rows</text>
  <rect x="1070" y="224" width="245" height="35" fill="#fef3c7" stroke="#d99a16" class="box"/>
  <text x="1192" y="247" text-anchor="middle" class="body">Held-out real test data · 5,333 rows</text>

  <path d="M310 203 H382" class="flow"/>
  <path d="M655 203 H727" class="flow"/>
  <path d="M980 184 H1062" class="flow"/>
  <path d="M980 222 H1048 V241 H1062" class="flow"/>
  <path d="M1070 184 H1010 V325 H240 V363" class="branch"/>

  <rect x="45" y="305" width="1310" height="275" fill="#f8fafc" stroke="#cbd5e1" class="box"/>
  <text x="68" y="337" class="section">2. Training-only processing and synthetic data generation</text>

  <rect x="85" y="371" width="310" height="94" fill="#fef3c7" stroke="#d99a16" class="box"/>
  <text x="240" y="399" text-anchor="middle" class="box-title">Fit preprocessing on real train only</text>
  <text x="240" y="423" text-anchor="middle" class="body">KNN imputation (k=5)</text>
  <text x="240" y="446" text-anchor="middle" class="body">Encode observed missingness</text>

  <rect x="470" y="365" width="370" height="111" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="655" y="393" text-anchor="middle" class="box-title">Fit tabular data generators</text>
  <text x="655" y="419" text-anchor="middle" class="body">CTGAN · TVAE · RealTabFormer</text>
  <text x="655" y="445" text-anchor="middle" class="small">Train using real training data only</text>

  <rect x="915" y="359" width="365" height="62" fill="#fce7f3" stroke="#db4c91" class="box"/>
  <text x="1097" y="385" text-anchor="middle" class="box-title">Restore missing values</text>
  <text x="1097" y="406" text-anchor="middle" class="small">Random-rate masking or generated indicators</text>
  <rect x="915" y="439" width="365" height="62" fill="#fce7f3" stroke="#db4c91" class="box"/>
  <text x="1097" y="465" text-anchor="middle" class="box-title">Synthetic training datasets</text>
  <text x="1097" y="486" text-anchor="middle" class="small">CTGAN / TVAE / RealTabFormer × strategy</text>

  <path d="M395 418 H462" class="flow"/>
  <path d="M840 405 H907" class="flow"/>
  <path d="M1097 421 V431" class="flow"/>
  <text x="240" y="496" text-anchor="middle" class="note">No held-out test data used here</text>

  <rect x="85" y="522" width="1195" height="39" fill="#eff6ff" stroke="#93c5fd" rx="8"/>
  <text x="682" y="547" text-anchor="middle" class="small">Real training data is also retained as the reference baseline and fidelity-comparison dataset.</text>

  <rect x="45" y="613" width="1310" height="184" fill="#f8fafc" stroke="#cbd5e1" class="box"/>
  <text x="68" y="645" class="section">3. Fidelity and predictive utility evaluation</text>

  <rect x="95" y="678" width="335" height="83" fill="#dcfce7" stroke="#22a05a" class="box"/>
  <text x="262" y="706" text-anchor="middle" class="box-title">Synthetic-data fidelity</text>
  <text x="262" y="730" text-anchor="middle" class="body">Compare synthetic vs. real training data</text>
  <text x="262" y="750" text-anchor="middle" class="small">Column shapes · pairwise trends · missingness</text>

  <rect x="535" y="678" width="300" height="83" fill="#ede9fe" stroke="#8b5cf6" class="box"/>
  <text x="685" y="706" text-anchor="middle" class="box-title">Train XGBoost classifier</text>
  <text x="685" y="730" text-anchor="middle" class="body">One classifier per training dataset</text>
  <text x="685" y="750" text-anchor="middle" class="small">Real-train classifier is the reference</text>

  <rect x="940" y="678" width="345" height="83" fill="#dcfce7" stroke="#22a05a" class="box"/>
  <text x="1112" y="706" text-anchor="middle" class="box-title">Evaluate on held-out real test</text>
  <text x="1112" y="730" text-anchor="middle" class="body">Precision · recall · F1 · ROC-AUC</text>
  <text x="1112" y="750" text-anchor="middle" class="small">Fixed test set; no model-selection use</text>

  <path d="M1097 501 V597 H262 V670" class="branch"/>
  <path d="M1192 213 V585 H685 V670" class="branch"/>
  <path d="M395 465 V580 H430 V720 H527" class="branch"/>
  <path d="M915 470 H885 V630 H685 V670" class="flow"/>
  <path d="M835 720 H932" class="flow"/>
  <path d="M1192 259 V670" class="flow"/>

  <rect x="220" y="831" width="960" height="57" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="700" y="856" text-anchor="middle" class="box-title">Saved results, fitted models, and SHAP summaries → offline Streamlit dashboard</text>
  <text x="700" y="878" text-anchor="middle" class="small">Prediction · generator comparisons · explainability · exploratory what-if analysis</text>
  <path d="M1112 761 V815 H1060 V823" class="branch dashed"/>
  <path d="M262 761 V814 H340 V823" class="branch dashed"/>

  <text x="700" y="908" text-anchor="middle" class="note">Research prototype — not a live LMS system or a high-stakes student decision tool</text>
</svg>
